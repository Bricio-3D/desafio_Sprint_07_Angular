<section class="img-bg">
    <img src="img/ranger.png" alt="Imagem de fundo" class="img-fundo">
</section>
<section class="login-form">
    <header class="logo-header">
        <h1><img src="img/ford.png" alt="Logo" class="logo"></h1>
    </header>
    <h2> Boas-Vindas</h2>
    <form>
        <div class="login-campo">
            <input type="text" id="username" placeholder="Insira seu e-mail" name="username" required>
        </div>
        <div class="senha-campo">
            <input type="password" id="password" placeholder="Insira sua senha" name="password" required>
        </div>
        <div class="checkbox-campo">
            <div class="checkbox-span">
                <span id="remember-label" for="remember">Logar automaticamente</span>
                <label class="switch">
                    <input type="checkbox" id="remember" name="remember" required>
                    <span class="slider"></span>
                </label>
            </div>
            <span class="icon-info" title="Mantém você logado neste dispositivo">ⓘ</span>
        </div>
        <button type="submit" id="btnEntrar" disabled>Entrar</button>
    </form>
</section>
