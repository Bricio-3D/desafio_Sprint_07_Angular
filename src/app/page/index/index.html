<section class="img-bg">
    <img src="img/ranger.png" alt="Imagem de fundo" class="img-fundo">
</section>
<section class="login-form">
    <header class="logo-header">
        <h1><img src="img/ford.png" alt="Logo" class="logo"></h1>
    </header>
    <h2> Boas-Vindas</h2>
    <form (ngSubmit)="fazerLogin()">
        <div class="login-campo">
            <input type="text" id="username" placeholder="Insira seu e-mail ou usuário" name="username"
                [(ngModel)]="username" (input)="limparErro()" required>

            @if (!username) {
            <span class="icon-info" title="Insira seu e-mail ou usuário cadastrado">ⓘ</span>
            }
        </div>
        <!-- Campo Senha com o botão do olho por DENTRO e o ⓘ por FORA -->
        <div class="senha-campo">
            <div class="input-wrapper">
                <input [type]="mostrarSenha ? 'text' : 'password'" id="password" placeholder="Insira sua senha"
                    name="password" [(ngModel)]="password" (input)="limparErro()" required>
                <button type="button" class="btn-toggle-senha" (click)="toggleMostrarSenha()"
                    aria-label="Mostrar ou ocultar senha">
                    @if (mostrarSenha) {
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path
                            d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                        </path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                    } @else {
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666666" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                    }
                </button>
            </div>
            @if (!password) {
            <span class="icon-info" title="Insira sua senha de 6 dígitos">ⓘ</span>
            }
        </div>
        @if (errorMessage) {
        <p class="mensagem-erro">{{ errorMessage }}</p>
        }
        <!-- Checkbox Logar automaticamente -->
        <div class="checkbox-campo">
            <span id="remember-label" for="remember">Logar automaticamente</span>
            <label class="switch">
                <input type="checkbox" id="remember" name="remember" [(ngModel)]="remember">
                <span class="slider"></span>
            </label>
            @if (!remember) {
            <span class="icon-info" title="Mantém você logado neste dispositivo">ⓘ</span>
            }
        </div>
        <button type="submit" id="btnEntrar" [disabled]="!username || !password">Entrar</button>
    </form>
</section>
