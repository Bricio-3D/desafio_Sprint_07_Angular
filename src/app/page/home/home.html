<header class="topo">
    <!-- Botao Menu -->
    <button class="btn-menu" aria-label="Abrir menu" (click)="toggleMenu()">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#1351d8" stroke-width="2">
            <line x1="3" y1="6" x2="21" y2="6" />
            <line x1="3" y1="12" x2="21" y2="12" />
            <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
    </button>


    <button class="btn-logout" aria-label="Sair" (click)="logout()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1351d8" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
        </svg>
    </button>
</header>

<!-- Exibe o menu lateral apenas se menuAberto for true -->
@if (menuAberto) {
<app-menu></app-menu>
}

<section class="img-bg">
    <img src="img/ranger.png" alt="Imagem de fundo" class="img-fundo">
</section>
<section>
    <div class="janela-bemvindo">
        <div class="cabecalho-janela">
            <h1>Sistema de Dados FORD</h1>
        </div>
        <div class="corpo-janela">
            <h2>Seja bem vindo(a)!</h2>
        </div>
    </div>
</section>
